name: Сборка APK Titan 2 / Elite / Pro

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

concurrency:
  group: titan2-apk-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Загрузить titan2-rostest
        uses: actions/checkout@v4

      - name: Подготовить исходники TypeQ25 при первой сборке
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "app/build.gradle.kts" ]; then
            git clone --depth 1 --branch master https://github.com/skontakt/TypeQ25.git /tmp/typeq25
            rsync -a \
              --exclude '.git' \
              --exclude '.github' \
              --exclude '*.md' \
              --exclude 'README*' \
              /tmp/typeq25/ "$GITHUB_WORKSPACE/"
            python3 scripts/prepare_titan2.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Import TypeQ25 adapted for Titan 2, Elite, Elite Pro"
            git push origin HEAD:main
          else
            echo "Исходники уже загружены"
          fi

      - name: Проверить расположение русских букв по фото
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("app/src/main/assets/common/layouts")
          expected = {
              "Q": "йц", "W": "у", "E": "к", "R": "её", "T": "н",
              "Y": "г", "U": "шщ", "I": "з", "O": "хъ", "P": "ю",
              "A": "фы", "S": "в", "D": "а", "F": "п", "G": "р",
              "H": "о", "J": "л", "K": "д", "L": "жэ",
              "Z": "яч", "X": "с", "C": "м", "V": "и",
              "B": "т", "N": "ь", "M": "б",
          }
          data = json.loads((p / "russian_q25_rostest.json").read_text())
          actual = {}
          for key, mapping in data["mappings"].items():
              actual[key.removeprefix("KEYCODE_")] = "".join(
                  t["lowercase"] for t in mapping.get("taps", [mapping])
              )
          assert actual == expected, (actual, expected)
          assert len(list(p.glob("*.json"))) == 3
          print("Расположение подтверждено: 33 буквы, первая сверху")
          PY

      - name: Настроить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print -quit)"
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDK_MANAGER" ]; then
            echo "::error::sdkmanager недоступен"
            exit 1
          fi
          "$SDK_MANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Создать временный релизный ключ
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build
          echo "TITAN_SIGNING_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -keystore app/build/titan-release.jks \
            -alias titan2 -storepass "$(grep '^TITAN_SIGNING_PASSWORD=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)" \
            -keypass "$(grep '^TITAN_SIGNING_PASSWORD=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)" \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=Titan2 Rostest Offline, O=Keyboard, C=LT"

      - name: Собрать устанавливаемый APK
        env:
          TITAN_RELEASE_KEYSTORE: build/titan-release.jks
          TITAN_RELEASE_STORE_PASSWORD: ${{ env.TITAN_SIGNING_PASSWORD }}
          TITAN_RELEASE_KEY_ALIAS: titan2
          TITAN_RELEASE_KEY_PASSWORD: ${{ env.TITAN_SIGNING_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Проверить отсутствие сетевых и чувствительных разрешений
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee /tmp/titan-permissions.txt
          if grep -E 'android.permission.(INTERNET|RECORD_AUDIO|READ_PHONE_STATE|ANSWER_PHONE_CALLS|MODIFY_PHONE_STATE)' /tmp/titan-permissions.txt; then
            echo "::error::Небезопасное разрешение осталось"; exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Выпустить APK напрямую, не prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk Titan2-Rostest.apk
          if gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.0.0 Titan2-Rostest.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v2.0.0 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          else
            gh release create v2.0.0 Titan2-Rostest.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Клавиатура для Titan 2 / Elite / Pro — v2.0.0" \
              --notes "Titan 2 / Elite / Pro: три раскладки, Alt + Пробел. Офлайн: без подсказок слов, истории буфера, доступа в интернет, резервного копирования, службы специальных возможностей и голосового ввода. APK подписан одноразовым релизным ключом: перед установкой удалите старую версию (настройки будут сброшены)." \
              --latest
          fi
